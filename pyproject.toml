[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-match"
version = "0.0.1"
description = "Song-to-Kemper rig matcher: find the guitar tones in a song and map them to Kemper rigs and a Performance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    "mutagen>=1.47",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy or awkward-to-build packages stay optional so the base install is quick.
separation = ["torch>=2.1", "torchaudio>=2.1", "demucs>=4.0"]
clustering = ["hdbscan>=0.8"]
spotify = ["spotipy>=2.23"]
data = ["pandas>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
rig-match = "rig_match.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
